<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reuni SN Nusantara 2026</title>

  <!-- File CSS utama -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ================= HEADER ================= -->
<header>
  <!-- Judul utama acara -->
  <h1></h1>
  <p></p>
</header>


<!-- ================= RUNNING TEXT ================= -->
<div class="marquee">
  <p>Selamat Datang di Reuni SN Nusantara 2026 | Jangan lupa daftar Peserta atau UMKM | Hubungi Call Center jika butuh informasi</p>
</div>

  <!-- ================= SPONSOR SECTION ================= -->
<section class="sponsor-section">
  <h2>SPONSORSHIP</h2>
  <div class="sponsor-gallery">
    <img src="images/MAG.jpeg" class="sponsor-img">
    <img src="images/MJ.jpeg" class="sponsor-img">
    <img src="images/OSN.jpeg" class="sponsor-img">

    <img src="images/OSN.jpeg" class="sponsor-img">
    <img src="images/OSN.jpeg" class="sponsor-img">
    <img src="images/OSN.jpeg" class="sponsor-img">
  </div>
</section>

<!-- ================= TOMBOL MENU UTAMA ================= -->
<main>
  <button class="btn panduan" onclick="bukaPanduan()">Panduan Peserta</button>
  <button class="btn proposal" onclick="bukaProposal()">Proposal</button>
  <button class="btn peserta" id="btnPeserta">Daftar Peserta</button>
  <button class="btn umkm" id="btnUMKM">Daftar UMKM</button>
  <button class="btn callcenter" id="btnCallCenter">Call Center</button>

  <!-- LOGIN DI DALAM MAIN -->
  <section class="login-box">
    <h3>Login Peserta</h3>
    <input type="text" id="nohpLogin" placeholder="Masukkan No HP terdaftar">
    <button onclick="loginPeserta()">Login</button>
  </section>
</main>


<!-- ================= POPUP DASHBOARD PESERTA ================= -->

<div id="popupDashboard" class="popup-overlay">
  <div class="popup-box">
    
    <!-- Tombol close X -->
    <div class="close-x" onclick="tutupDashboard()">×</div>

    <!-- Isi data peserta -->
    <div id="isiDashboard"></div>

  </div>
</div>



<!-- ================= MODAL GOOGLE FORM PESERTA ================= -->
<div id="modalPeserta" class="modal">
  <div class="modal-content">
    <span class="close">&times;</span>
    <h2>Daftar Peserta</h2>
    <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSdPklR_AIJbjMaDkoQSY0h8393m5UpqyY5ORo1oxPptBibMCw/viewform?usp=header" width="100%" height="500"></iframe>
  </div>
</div>


<!-- ================= MODAL GOOGLE FORM UMKM ================= -->
<div id="modalUMKM" class="modal">
  <div class="modal-content">
    <span class="close">&times;</span>
    <h2>Daftar UMKM</h2>
    <iframe src="ISI_LINK_FORM_UMKM" width="100%" height="500"></iframe>
  </div>
</div>


<!-- ================= MODAL CALL CENTER ================= -->
<div id="modalCallCenter" class="modal">
  <div class="modal-content">
    <span class="close">&times;</span>
    <h2>Call Center</h2>
    <button onclick="openWhatsApp('6287748283935')">Informasi Umum</button>
    <button onclick="openWhatsApp('6282312636561')">Sponsorship</button>
  </div>
</div>


<!-- ================= LINK GOOGLE MAPS ================= -->
<p class="lihat-lokasi">
  Lihat lokasi acara di 
  <a href="https://maps.app.goo.gl/Rv4JjxwD6UzkJhwG8" target="_blank">Google Maps</a>
</p>

<!-- ================= MODAL ZOOM SPONSOR ================= -->
<div id="modalSponsor" class="modal">
  <span class="close">&times;</span>
  <img class="modal-content" id="imgModal">
</div>


<!-- ================= MODAL PANDUAN ================= -->
<div id="modalPanduan" class="modal">
  <div class="modal-content">
    <span class="close" onclick="tutupPanduan()">&times;</span>
    <h2>Panduan Peserta</h2>
    <iframe src="files/KETENTUAN.pdf" width="100%" height="500"></iframe>
  </div>
</div>


<!-- ================= MODAL PROPOSAL ================= -->
<div id="modalProposal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="tutupProposal()">&times;</span>
    <h2>Proposal Kegiatan</h2>
    <iframe src="files/PROPOSAL.pdf" width="100%" height="500"></iframe>
  </div>
</div>


<!-- ================= FOOTER ================= -->
<footer>
  &copy; OSN Mobile
</footer>

<!-- File JavaScript tambahan -->
<script src="script.js"></script>

</body>
</html>
