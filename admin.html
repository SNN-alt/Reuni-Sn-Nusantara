<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Scan Kehadiran Panitia</title>

  <!-- Library QR Scanner -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background: #f2f2f2;
    }
    input, button {
      padding: 10px;
      font-size: 16px;
      margin: 5px;
    }
    #reader {
      width: 300px;
      margin: auto;
    }
  </style>
</head>
<body>

<h2>Login Panitia</h2>

<div id="loginPanitia">
  <input type="password" id="kodePanitia" placeholder="Masukkan Kode Panitia">
  <br>
  <button onclick="cekKode()">Masuk</button>
</div>

<div id="scannerSection" style="display:none;">
  <h3>Scan QR Peserta</h3>
  <div id="reader"></div>
  <p id="hasilScan"></p>
</div>


<script>
const KODE_BENAR = "PANITIASN";

/* === GANTI dengan URL Web App Apps Script kamu === */
const apiUrl = "https://script.google.com/macros/s/AKfycbyyZnfx-ilQjNhAG0gP-rO_ctPne7HoxuREYerYXfrRTvJRiFYJReZkuT6kZC8dqop3/exec";

let html5QrCode;

function cekKode(){
  const input = document.getElementById("kodePanitia").value.trim();
  if(input === KODE_BENAR){
    document.getElementById("loginPanitia").style.display="none";
    document.getElementById("scannerSection").style.display="block";
    mulaiScan();
  } else {
    alert("Kode Panitia Salah!");
  }
}

function mulaiScan(){
  html5QrCode = new Html5Qrcode("reader");
  html5QrCode.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 250 },
    qrCodeMessage => {
      html5QrCode.stop();
      prosesHadir(qrCodeMessage);
    },
    errorMessage => {}
  );
}

function prosesHadir(kodeQR){
  fetch(apiUrl + "?mode=scan&kode=" + encodeURIComponent(kodeQR))
    .then(res => res.json())
    .then(data => {
      document.getElementById("hasilScan").innerHTML = data.message;
      setTimeout(()=>mulaiScan(), 2000);
    })
    .catch(()=>{
      document.getElementById("hasilScan").innerHTML="❌ Gagal koneksi server";
      setTimeout(()=>mulaiScan(), 2000);
    });
}
</script>

</body>
</html>
