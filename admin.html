<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scan QR Admin</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:#0a0f25;
  color:#fff;
  text-align:center;
  padding:20px;
}

h2{
  margin-bottom:10px;
}

.box{
  background:#111c3f;
  padding:20px;
  border-radius:20px;
  max-width:380px;
  margin:20px auto;
}

#reader{
  width:100%;
  border-radius:12px;
  overflow:hidden;
}

#hasil{
  margin-top:20px;
  padding:15px;
  border-radius:12px;
  background:#000;
  font-size:20px;
  font-weight:bold;
}

.ok{color:#28a745;}
.warn{color:#ffc107;}
.err{color:#dc3545;}
</style>
</head>

<body>

<h2>📷 SCAN QR</h2>

<div class="box">
  <div id="reader"></div>
  <div id="hasil">Menunggu scan...</div>
</div>

<script src="https://unpkg.com/html5-qrcode"></script>

<script>
const apiUrl = "https://script.google.com/macros/s/AKfycbyyZnfx-ilQjNhAG0gP-rO_ctPne7HoxuREYerYXfrRTvJRiFYJReZkuT6kZC8dqop3/exec";

let scanner;

/* ================= START SCANNER ================= */
function startScanner(){

  const hasil = document.getElementById("hasil");

  scanner = new Html5Qrcode("reader");

  scanner.start(
    { facingMode: "environment" }, // 🔥 kamera belakang
    { fps: 10, qrbox: 250 },

    async (text) => {

      await scanner.stop();

      hasil.innerHTML = "⏳";

      try{

        /* ================= FIX QR ================= */
        let kode = text.trim();

        // kalau QR berupa URL → ambil datanya
        if (kode.includes("data=")) {
          kode = kode.split("data=")[1];
        }

        /* ================= HIT API ================= */
        const res = await fetch(`${apiUrl}?mode=scan&kode=${kode}`);
        const data = await res.json();

        /* ================= HASIL ================= */
        if (data.status === "SUCCESS"){
          hasil.innerHTML = `<div class="ok">✅ SCAN SUKSES</div>`;
          navigator.vibrate?.(150);
        }
        else if (data.status === "ALREADY_USED"){
          hasil.innerHTML = `<div class="warn">⚠ SUDAH SCAN</div>`;
        }
        else if (data.status === "NOT_ACTIVE"){
          hasil.innerHTML = `<div class="err">❌ QR BELUM AKTIF</div>`;
        }
        else{
          hasil.innerHTML = `<div class="err">❌ QR TIDAK DITEMUKAN</div>`;
        }

      }catch{
        hasil.innerHTML = `<div class="err">❌ GAGAL KONEKSI</div>`;
      }

      /* ================= AUTO SCAN ULANG ================= */
      setTimeout(() => {
        startScanner();
      }, 2000);

    }
  );
}

/* ================= AUTO START ================= */
document.addEventListener("DOMContentLoaded", startScanner);
</script>

</body>
</html>
