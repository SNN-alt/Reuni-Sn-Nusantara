<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Scanner - Reuni SN 2026</title>

  <style>
    body{
      font-family: 'Segoe UI', sans-serif;
      background:#0a0f25;
      color:#fff;
      text-align:center;
      padding:20px;
    }

    h2{
      margin-bottom:10px;
      letter-spacing:1px;
    }

    .scanner-box{
      background:#111c3f;
      padding:25px;
      border-radius:20px;
      max-width:400px;
      margin:20px auto;
      box-shadow:0 20px 60px rgba(0,0,0,.6);
    }

    #reader{
      width:100%;
      border-radius:15px;
      overflow:hidden;
    }

    #hasilScan{
      margin-top:20px;
      padding:15px;
      border-radius:12px;
      background:#000;
      font-weight:600;
      min-height:60px;
    }

    .success{color:#28a745;}
    .warning{color:#ffc107;}
    .error{color:#dc3545;}

    .footer{
      margin-top:30px;
      font-size:12px;
      color:#aaa;
    }

  </style>
</head>

<body>

  <h2>📷 SCAN QR PESERTA</h2>
  <p>Reuni SN Nusantara 2026</p>

  <div class="scanner-box">
    <div id="reader"></div>
    <div id="hasilScan">Menunggu scan...</div>
  </div>

  <div class="footer">
    Admin Panel – 1 Akun untuk semua panitia
  </div>

  <!-- QR LIBRARY -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <!-- SCRIPT -->
  <script>

    const apiUrl = "https://script.google.com/macros/s/AKfycbyyZnfx-ilQjNhAG0gP-rO_ctPne7HoxuREYerYXfrRTvJRiFYJReZkuT6kZC8dqop3/exec";

    function startScanner(){

      const hasil = document.getElementById("hasilScan");

      const html5QrCode = new Html5Qrcode("reader");

      Html5Qrcode.getCameras().then(devices => {

        if (!devices.length){
          hasil.innerHTML = "<span class='error'>❌ Kamera tidak ditemukan</span>";
          return;
        }

        html5QrCode.start(
          devices[0].id,
          { fps:10, qrbox:250 },

          async (decodedText) => {

            await html5QrCode.stop();

            hasil.innerHTML = "⏳ Memproses...";

            try{

              const res = await fetch(`${apiUrl}?mode=scan&kode=${decodedText}`);
              const data = await res.json();

              if (data.status === "SUCCESS"){

                hasil.innerHTML = `
                  <div class="success">
                    ✅ ${data.nama}<br>
                    HADIR<br>
                    Tenda: ${data.tenda}
                  </div>
                `;

                navigator.vibrate?.(200);

              } 
              else if (data.status === "ALREADY_USED"){

                hasil.innerHTML = `<div class="warning">⚠ Sudah pernah scan</div>`;

              } 
              else if (data.status === "NOT_ACTIVE"){

                hasil.innerHTML = `<div class="error">❌ QR belum aktif</div>`;

              } 
              else{

                hasil.innerHTML = `<div class="error">❌ QR tidak ditemukan</div>`;
              }

            }catch{
              hasil.innerHTML = `<div class="error">Gagal koneksi server</div>`;
            }

            setTimeout(startScanner, 2500);
          }

        );

      });
    }

    document.addEventListener("DOMContentLoaded", startScanner);

  </script>

</body>
</html>
