<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scan QR Admin</title>

  <style>
    body{
      font-family:Arial,sans-serif;
      background:#0a0f25;
      color:#fff;
      text-align:center;
      padding:20px;
    }

    h2{margin-bottom:10px;}

    .box{
      background:#111c3f;
      padding:20px;
      border-radius:20px;
      max-width:380px;
      margin:20px auto;
    }

    #reader{
      width:100%;
      border-radius:12px;
      overflow:hidden;
    }

    #hasil{
      margin-top:20px;
      padding:15px;
      border-radius:10px;
      background:#000;
      font-size:18px;
      font-weight:bold;
    }

    .ok{color:#28a745;}
    .warn{color:#ffc107;}
    .err{color:#dc3545;}
  </style>
</head>

<body>

<h2>📷 SCAN QR</h2>

<div class="box">
  <div id="reader"></div>
  <div id="hasil">Menunggu scan...</div>
</div>

<script src="https://unpkg.com/html5-qrcode"></script>

<script>
const apiUrl = "https://script.google.com/macros/s/AKfycbyyZnfx-ilQjNhAG0gP-rO_ctPne7HoxuREYerYXfrRTvJRiFYJReZkuT6kZC8dqop3/exec";

let scanner;

function start(){

  const hasil = document.getElementById("hasil");

  scanner = new Html5Qrcode("reader");

  scanner.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 250 },

    async (text) => {

      await scanner.stop();

      hasil.innerHTML = "⏳";

      try{

        const res = await fetch(`${apiUrl}?mode=scan&kode=${text}`);
        const data = await res.json();

        if (data.status === "SUCCESS"){
          hasil.innerHTML = `<div class="ok">✅ Scan sukses</div>`;
          navigator.vibrate?.(150);
        }
        else if (data.status === "ALREADY_USED"){
          hasil.innerHTML = `<div class="warn">⚠ Sudah scan</div>`;
        }
        else{
          hasil.innerHTML = `<div class="err">❌ Gagal</div>`;
        }

      }catch{
        hasil.innerHTML = `<div class="err">❌ Error</div>`;
      }

      setTimeout(start, 1500);
    }
  );
}

document.addEventListener("DOMContentLoaded", start);
</script>

</body>
</html>
